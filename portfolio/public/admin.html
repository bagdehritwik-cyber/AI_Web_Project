<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Portfolio</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Contact Requests</h1>
        <div class="d-flex gap-2">
          <a href="#" id="exportLink" class="btn btn-success">Export .xlsx</a>
          <a href="/" class="btn btn-outline-secondary">Back to Portfolio</a>
        </div>
      </div>

      <div class="table-responsive bg-white shadow-sm rounded">
        <table class="table table-striped mb-0" id="requestsTable">
          <thead class="table-dark">
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Message</th>
              <th>Date & Time</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <script>
      const tbody = document.querySelector('#requestsTable tbody');
      const exportLink = document.getElementById('exportLink');
      const token = new URLSearchParams(window.location.search).get('token') || '';

      const formatDateTime = (value) => {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleString();
      };

      const setEmptyState = (message, extraClass = '') => {
        tbody.innerHTML = '';
        const row = document.createElement('tr');
        const cell = document.createElement('td');
        cell.colSpan = 4;
        cell.className = `text-center py-4 ${extraClass}`.trim();
        cell.textContent = message;
        row.appendChild(cell);
        tbody.appendChild(row);
      };

      if (!token) {
        exportLink.classList.add('disabled');
        setEmptyState('Missing admin token. Open /admin?token=YOUR_ADMIN_TOKEN', 'text-danger');
      } else {
        exportLink.href = `/api/admin/export?token=${encodeURIComponent(token)}`;

        fetch(`/api/admin/contacts?token=${encodeURIComponent(token)}`)
          .then((res) => res.json())
          .then((payload) => {
            if (!payload.success || !payload.data.length) {
              setEmptyState('No contact requests yet.');
              return;
            }

            tbody.innerHTML = '';
            payload.data.forEach((item) => {
              const row = document.createElement('tr');

              const nameCell = document.createElement('td');
              nameCell.textContent = item.name;

              const emailCell = document.createElement('td');
              const emailLink = document.createElement('a');
              emailLink.href = `mailto:${item.email}`;
              emailLink.textContent = item.email;
              emailCell.appendChild(emailLink);

              const messageCell = document.createElement('td');
              messageCell.textContent = item.message;

              const dateCell = document.createElement('td');
              dateCell.textContent = formatDateTime(item.created_at);

              row.appendChild(nameCell);
              row.appendChild(emailCell);
              row.appendChild(messageCell);
              row.appendChild(dateCell);
              tbody.appendChild(row);
            });
          })
          .catch(() => {
            setEmptyState('Failed to load contact requests.', 'text-danger');
          });
      }
    </script>
  </body>
</html>
